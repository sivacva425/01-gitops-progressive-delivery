apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: production-web-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/sivacva425/git-ops-repo-.git'
    targetRevision: HEAD
    path: helm-charts/web-app
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
